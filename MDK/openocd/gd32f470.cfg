# GD32F470VET6 OpenOCD target configuration
# Based on stm32f4x.cfg - GD32F4xx shares Cortex-M4 core and compatible flash interface
# Chip:  GD32F470VET6 (512KB Flash @ 0x08000000, 192KB SRAM + 64KB TCM)

source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

set _CHIPNAME gd32f470
set _ENDIAN little
set _WORKAREASIZE 0x8000

# GD32F4xx TAP IDCODE: 0 means autodetect; force known value if needed
set _CPUTAPID 0
# set _CPUTAPID 0x4ba00477

# SWD tap + DAP (OpenOCD 0.12 style, same as stm32f1x/stm32f7x cfg)
swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap     -work-area-phys 0x20000000 -work-area-size 0x8000

# 512KB internal flash (stm32f2x driver is compatible with GD32F4xx flash controller)
flash bank $_CHIPNAME.flash stm32f2x 0x08000000 0x80000 0 0 $_TARGETNAME

# SWD reset via SYSRESETREQ (works without nRST line)
cortex_m reset_config sysresetreq
