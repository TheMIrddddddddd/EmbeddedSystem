dependenceList: []
outDir: build
miscInfo:
  uid: 43f6351a46c74d1fb174ad953db34898
targets:
  IndustrialEmbedded_Boot:
    cppPreprocessAttrs:
      defineList:
        - USE_STDPERIPH_DRIVER
        - GD32F470
        - NDEBUG
      incList:
        - .
        - ../../Driver/CMSIS/GD/GD32F4xx/Include
        - ../../Driver/CMSIS
        - ../../Libraries/Include
        - ../../BSP
        - ../../Common/inc
        - ../../Middleware/CLI/inc
        - ../../Bootloader/inc
      libList: []
    excludeList: []
    settings:
      debugger: cortex-debug
    toolchain: AC5
    toolchainConfigMap:
      AC5:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 4
          afterBuildTasks: []
          asm-compiler:
            defines: []
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: --diag_suppress=1 --diag_suppress=1295
            C_FLAGS: --diag_suppress=1 --diag_suppress=1295
            c99-mode: true
            gnu-extensions: true
            one-elf-section-per-function: true
            optimization: level-0
            warnings: all-warnings
          global:
            output-debug-info: enable
            use-microLIB: true
          linker:
            $disableOutputTask: false
            $outputTaskExcludes:
              - .s19
            output-format: elf
            ro-base: "0x08000000"
            rw-base: "0x20000000"
            xo-base: ""
        scatterFilePath: ""
        storageLayout:
          RAM:
            - id: 1
              isChecked: true
              mem:
                size: "0x30000"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
            - id: 2
              isChecked: false
              mem:
                size: "0x10000"
                startAddr: "0x10000000"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x10000"
                startAddr: "0x8000000"
              tag: IROM
        useCustomScatterFile: false
    uploadConfigMap:
      OpenOCD:
        baseAddr: "0x08000000"
        bin: ""
        interface: cmsis-dap
        target: gd32f470
    uploader: OpenOCD
